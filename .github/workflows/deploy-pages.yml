name: Deploy Flutter web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web app
        # Backend URL: set the repo variable BACKEND_URL_OVERRIDE (Settings >
        # Secrets and variables > Actions > Variables) to point the site at
        # another backend, e.g. a Hugging Face Space. Not a secret -- it ends
        # up in public client-side JS regardless. When unset, falls back to
        # the Cloud Run URL below; update that if the service is ever
        # redeployed under a different URL. The name is deliberately new: a
        # stale variable called BACKEND_URL caused the 2026-08-13 outage (see
        # DEPLOYMENT_STATUS.md), so never reuse that name.
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL_OVERRIDE || 'https://wildcat-mhri-backend-600531524448.us-west1.run.app/api/v1' }}
        run: |
          flutter build web --release --base-href /pwdf_prob_stg/ --dart-define=BACKEND_URL="$BACKEND_URL"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
